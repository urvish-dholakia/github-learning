name: CI
run-name: Run by @${{ github.actor }}

on:
    
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
env:
  env_name: github-learning

jobs:
  Application_Name:
    name: "App Name"
    runs-on: ubuntu-latest
    steps:
      - name: Display application name
        run: echo "$env_name"
  
  Display_Environment:
    name: Display environment
    runs-on: ubuntu-latest
    env:
      env_name_job: job_level_env_01
      env_name: job_level_env_02
    steps:
        - name: env display under step
          env:
            env_name_step: step_level_env
          run: echo "$env_name_step"
        - name: env display under job
          run: | 
            echo "-------------"
            echo "$env_name_job"
            echo "-------------"
            echo "$env_name_step"
            echo "-------------"
            echo "$env_name"

  fetch-code:
    name: "Fetch-Code"
    runs-on: ubuntu-latest
    needs: Application_Name
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

  validate:
    name: "Repository-Validation"
    runs-on: ubuntu-latest
    env:
      env_name: test
    needs: fetch-code
    steps:
      - name: Validate repository
        uses: actions/checkout@v4
      - name: Running CI Validation
        run: |
          echo "Running CI validation"
          $env_name -f README.md
          $env_name -f version.txt

  version_display:
    name: "show_version"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Display version
        uses: actions/checkout@v4
      - name: Open version file 
        run: cat version.txt
