name: CI
run-name: Run by @${{ github.actor }}

on:
    
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
env:
  APP_NAME: github-learning

jobs:
  Application_Name:
    name: "App Name"
    runs-on: ubuntu-latest
    steps:
      - name: Display application name
        run: echo "$APP_NAME"
  
  Display_Environment:
    name: Display environment
    runs-on: ubuntu-latest
    env:
      JOB_ENV: job_level_env
    steps:
        - name: env display under step
          env:
            APP_ENV: step_level_env
          run: echo "$APP_ENV"
        - name: env display under job
          run: | 
            echo "$JOB_ENV"
            echo "$APP_ENV"

  fetch-code:
    name: "Fetch-Code"
    runs-on: ubuntu-latest
    needs: Application_Name
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

  validate:
    name: "Repository-Validation"
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    needs: fetch-code
    steps:
      - name: Validate repository
        uses: actions/checkout@v4
      - name: Running CI Validation
        run: |
          echo "Running CI validation"
          $APP_ENV -f README.md
          $APP_ENV -f version.txt

  version_display:
    name: "show_version"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Display version
        uses: actions/checkout@v4
      - name: Open version file 
        run: cat version.txt
