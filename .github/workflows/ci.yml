name: CI
run-name: Run by @${{ github.actor }}

on:
    
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  fetch_code:
    name: "Fetch_Code"
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
      - uses: actions/checkout@v7

  validate:
    name: "Repository_Validation"
    runs-on: ubuntu-latest
    needs: fetch_code
    steps:
      - name: Validate repository
        run: |
          echo "Running CI validation"
          test -f README.md
          test -f version.txt

  version_display:
    name: "show_version"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Display version
        run: cat version.txt
