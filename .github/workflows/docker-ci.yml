name: Docker Container CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build
        run: mvn clean package

  docker-build:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t springboot-app:${{ github.sha }} .

      - name: List Docker images
        run: docker images