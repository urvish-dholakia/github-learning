name: Setup Java and Maven

description: Common Java and Maven setup

inputs:
  java-version:
    description: Java version
    required: false
    default: '17'

runs:
  using: composite

  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Display Java version
      shell: bash
      run: java -version

    - name: Display Maven version
      shell: bash
      run: mvn -version